name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Typecheck, Lint, Build & Test (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server & client)
        run: npm run typecheck

      - name: Lint (server & client)
        run: npm run lint

      - name: Build production client
        run: npm run build

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Upload test & coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            server/coverage/
            server/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Security audit (production dependencies)
        run: |
          npm audit --prefix server --omit=dev --audit-level=high
          npm audit --prefix client --omit=dev --audit-level=high
        continue-on-error: false
